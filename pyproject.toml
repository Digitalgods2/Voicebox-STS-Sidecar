[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebox-sts-bridge"
version = "0.4.0"
description = "Loopback-only companion bridge for local VoiceBox speech-to-speech conversion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp>=2026.7.4,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
voicebox-sts-bridge = "voicebox_sts_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicebox_sts_bridge = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
